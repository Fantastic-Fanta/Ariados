[package]
name = "ariados"
version = "0.2.0"
edition = "2024"
description = "Static binary triage with evidence trails (Mach-O/ELF/PE)"
license = "MIT"
repository = "https://github.com/Fantastic-Fanta/Ariados"
readme = "README.md"
keywords = ["malware", "security", "reverse-engineering", "macho", "yara"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
capstone = "0.14.0"
clap = { version = "4.6.7", features = ["derive"] }
goblin = "0.10.7"
memchr = "2.8.3"
plist = "1.10.1"
rayon = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
toml = "1.1.8"
ureq = { version = "3.4.2", features = ["json"] }
walkdir = "2.5.0"
yara-x = "1.21.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

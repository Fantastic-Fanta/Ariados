# Capabilities: what a single function does, inferred from the library
# functions it calls and the strings it references. These are building blocks;
# the findings in behaviors.toml combine them. String patterns are regexes
# (case-sensitive unless you add (?i)); import patterns are case-insensitive
# substrings matched against the imported symbol name.

[[capability]]
id = "network"
# High-signal remote communication only. Raw socket/connect/send are too common
# in ordinary tools to be useful on their own, so they are deliberately absent.
imports = ["curl_easy", "CFURLCreateData", "CFHTTP", "NSURLSession",
           "NSURLConnection", "SSLWrite", "SSLHandshake"]
strings = ["^https?://", "^ftp://", "^wss?://"]

[[capability]]
id = "credential-access"
# Paths and filenames of places credentials and session data are kept.
strings = ["Login Data",
           "login\\.keychain",
           "cookies\\.sqlite",
           "Local State",
           "key4\\.db",
           "logins\\.json",
           "wallet\\.dat",
           "/\\.ssh/",
           "id_rsa",
           "Keychains"]
imports = ["SecKeychain", "SecItemCopyMatching"]

[[capability]]
id = "osascript-exec"
# Driving AppleScript / osascript, a common way to script the UI or escalate.
strings = ["osascript", "NSAppleScript"]
imports = ["NSAppleScript", "OSAExecute"]

[[capability]]
id = "password-dialog"
# Text of a prompt that asks the user for their password.
strings = ["(?i)display dialog",
           "(?i)needs your password",
           "(?i)enter your password",
           "(?i)with hidden answer"]

[[capability]]
id = "launch-persistence"
# Writing a login item, LaunchAgent or LaunchDaemon so code runs at startup.
strings = ["LaunchAgents/",
           "LaunchDaemons/",
           "/StartupItems/",
           "com\\.apple\\..*\\.plist",
           "loginwindow",
           "SMLoginItemSetEnabled"]
imports = ["SMLoginItemSetEnabled"]

[[capability]]
id = "shell-exec"
# Running another program or a shell command. fork/posix_spawn alone are too
# common (every tool that launches a child); require an exec/system/shell.
imports = ["system", "popen", "execve", "execl", "execlp", "execvp", "NSTask"]
strings = ["/bin/sh", "/bin/bash", "/bin/zsh", "/bin/sh -c"]

[[capability]]
id = "file-write"
imports = ["fopen", "fwrite", "fputs", "open", "write", "writeToFile", "rename", "unlink", "remove"]

[[capability]]
id = "anti-debug"
# Detecting or resisting a debugger / analysis. ptrace on macOS is almost
# always PT_DENY_ATTACH; sysctl/csops are too common to flag on their own.
imports = ["ptrace"]
strings = ["P_TRACED", "AmIBeingDebugged", "PT_DENY_ATTACH"]

[[capability]]
id = "dynamic-code"
# Loading or executing code at runtime — unpacking, plugins, injection.
# mmap/mprotect are far too common (allocators, JITs) to include here.
imports = ["dlopen", "NSCreateObjectFileImageFromMemory", "NSLinkModule"]

[[capability]]
id = "crypto"
imports = ["CCCrypt", "CCCryptorCreate", "EVP_", "AES_", "SecKeyCreate", "CryptoKit"]
strings = ["-----BEGIN"]

[[capability]]
id = "screen-capture"
imports = ["CGDisplayCreateImage", "CGWindowListCreateImage", "SCStream", "SCShareableContent"]

[[capability]]
id = "keylog-input"
imports = ["CGEventTapCreate", "IOHIDManager", "CGEventTapEnable"]

[[capability]]
id = "clipboard"
imports = ["NSPasteboard", "PasteboardCopyItemFlavors", "UIPasteboard"]

[[capability]]
id = "quarantine-evasion"
# Removing the quarantine flag or Gatekeeper attributes from a file.
strings = ["com\\.apple\\.quarantine", "xattr -d", "quarantine"]
imports = ["removexattr"]

[[capability]]
id = "env-discovery"
# Fingerprinting the host (hardware IDs, serial numbers, VM detection).
strings = ["IOPlatformSerialNumber", "IOPlatformUUID", "hw\\.model",
           "(?i)vmware", "(?i)virtualbox", "(?i)parallels"]
imports = ["gethostuuid"]

[[capability]]
id = "crypto-wallet"
# Specific desktop-wallet files/dirs and the MetaMask extension id. Generic
# words (keystore, Coinbase, Ledger) fire on unrelated software, so avoid them.
strings = ["Electrum/wallets",
           "Exodus/exodus\\.wallet",
           "wallet\\.dat",
           "\\.metamask",
           "nkbihfbeagmckhabcndgmadcdanpnbho"]

[[capability]]
id = "messenger-data"
# Session/token stores for chat apps targeted by stealers.
strings = ["Telegram Desktop",
           "discord/Local Storage",
           "discordcanary",
           "discordptb"]

[[capability]]
id = "gatekeeper-disable"
# Turning off Gatekeeper / Mac security assessment.
strings = ["spctl --master-disable", "--master-disable", "assessment\\.disable"]

[[capability]]
id = "tcc-access"
# Reaching the TCC privacy database (access grants for camera, disk, etc.).
strings = ["TCC\\.db", "com\\.apple\\.TCC"]

[[capability]]
id = "shell-download"
# The classic one-line dropper: fetch a script and pipe it to a shell.
strings = ["curl .*\\| *(sh|bash|zsh)", "wget .*\\| *(sh|bash)", "curl -fsSL"]
